version: "3.8"

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: renliziyuan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- App（Web + Socket.IO）----
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@postgres:5432/renliziyuan?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BACKUP_ENCRYPT_KEY: ${BACKUP_ENCRYPT_KEY}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      TRUST_PROXY: "1"
      SMS_DEV_MODE: "${SMS_DEV_MODE:-0}"
      UPLOAD_DRIVER: "${UPLOAD_DRIVER:-local}"
      UPLOAD_BASE_URL: ${SITE_URL:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Worker（定时任务 + 队列）----
  worker:
    build: .
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "src/lib/queue/worker.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@postgres:5432/renliziyuan?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BACKUP_ENCRYPT_KEY: ${BACKUP_ENCRYPT_KEY}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      UPLOAD_DRIVER: "${UPLOAD_DRIVER:-local}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  uploads_data:
