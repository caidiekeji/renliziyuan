version: "3.8"

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: renliziyuan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- App（Web + Socket.IO）----
  app:
    image: ghcr.io/caidiekeji/renliziyuan:latest
    build: .
    restart: unless-stopped
    ports:
      - "8182:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/renliziyuan?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
      JWT_REFRESH_SECRET: "b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3"
      ENCRYPTION_KEY: "c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4"
      BACKUP_ENCRYPT_KEY: "d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5"
      NEXT_PUBLIC_SITE_URL: "http://localhost:8182"
      TRUST_PROXY: "1"
      SMS_DEV_MODE: "0"
      UPLOAD_DRIVER: "local"
      UPLOAD_BASE_URL: "http://localhost:8182"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Worker（定时任务 + 队列）----
  worker:
    image: ghcr.io/caidiekeji/renliziyuan:latest
    build: .
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "src/lib/queue/worker.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/renliziyuan?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
      JWT_REFRESH_SECRET: "b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3"
      ENCRYPTION_KEY: "c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4"
      BACKUP_ENCRYPT_KEY: "d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5"
      NEXT_PUBLIC_SITE_URL: "http://localhost:8182"
      UPLOAD_DRIVER: "local"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  uploads_data:
